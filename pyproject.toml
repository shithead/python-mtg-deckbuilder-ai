[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mtg-deckbuilder-ai"
version = "0.1.0"
description = "AI-assisted Magic: The Gathering deck building"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["ai*", "database*", "environment*", "utils*", "test*"]
