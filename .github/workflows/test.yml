name: Test

on:
  push:
    branches: [main, vector_database]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-24.11

      - name: Run tests
        run: nix-shell --run "pytest test/ -v"
